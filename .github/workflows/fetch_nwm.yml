name: Fetch Hourly NWM Soil Moisture

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['fetch_nwm.py', '.github/workflows/fetch_nwm.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-nwm-soil-moisture
  cancel-in-progress: false

jobs:
  update-nwm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify NWM data contract
        run: python -m unittest discover -s tools -p test_nwm_contract.py -v

      - name: Run NWM script
        id: ingest
        continue-on-error: true
        run: python fetch_nwm.py

      - name: Commit and push changes
        if: always() && steps.ingest.outcome != 'skipped'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/nwm_soil_saturation.png static/nwm_metadata.json

          if git diff --cached --quiet; then
            echo "NWM soil-saturation products are unchanged."
            exit 0
          fi

          git commit -m "Automated update: NWM Hourly soil saturation"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "NWM products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push NWM products after three attempts."
          exit 1

      - name: Report failed update after retaining previous map
        if: always() && steps.ingest.outcome == 'failure'
        run: exit 1
