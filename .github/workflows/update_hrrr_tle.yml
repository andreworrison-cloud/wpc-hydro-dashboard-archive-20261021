name: Update HRRR-TLE Flash Flood Guidance

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if the newest complete HRRR-TLE cycle is already published'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-hrrr-tle
  cancel-in-progress: false

jobs:
  hrrr-gdi:
    # Independent sibling: starts with the cron-job.org dispatch, not after TLE.
    uses: ./.github/workflows/publish_gdi.yml
    permissions:
      contents: write

  update-hrrr-tle:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh queued run to latest branch head
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy scipy requests xarray cfgrib eccodes \
            matplotlib cartopy pillow

      - name: Verify GRIB decoder
        run: |
          python -m eccodes selfcheck
          python -m cfgrib selfcheck

      - name: Restore HRRR-TLE GRIB cache
        uses: actions/cache@v4
        with:
          path: .cache/hrrr_tle
          key: hrrr-tle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hrrr-tle-${{ runner.os }}-

      - name: Build newest complete HRRR / HRRR-TLE package
        shell: bash
        run: |
          set -euo pipefail
          force_arg=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            force_arg="--force"
          fi
          python fetch_hrrr_tle.py --output-dir static ${force_arg}

      - name: Validate generated package when present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("static")
          manifest_path = root / "hrrr_tle_manifest.json"
          if not manifest_path.exists():
              raise SystemExit("No HRRR-TLE manifest exists after build.")

          manifest = json.loads(manifest_path.read_text())
          if manifest.get("metadata_mode") != "hrrr_tle_dashboard_manifest_v1":
              raise SystemExit("Unexpected HRRR-TLE manifest contract.")

          layers = manifest.get("layers") or {}
          if len(layers) != 20:
              raise SystemExit(
                  f"Expected 20 synchronized overlays (2 HRRR diagnostics + 18 HRRR-TLE), "
                  f"found {len(layers)}."
              )

          expected_size = (6000, 3594)
          declared_size = (
              int(manifest.get("render_width_px", -1)),
              int(manifest.get("render_height_px", -1)),
          )
          if declared_size != expected_size:
              raise SystemExit(
                  f"Unexpected HRRR/HRRR-TLE render contract {declared_size}; "
                  f"expected {expected_size}."
              )
          if int(manifest.get("render_dpi", -1)) != 600:
              raise SystemExit(
                  f"Unexpected render DPI {manifest.get('render_dpi')}; expected 600."
              )

          for key, item in layers.items():
              p = root / item["file"]
              if not p.exists():
                  raise SystemExit(f"Missing overlay {key}: {p}")
              with Image.open(p) as image:
                  if image.size != expected_size:
                      raise SystemExit(
                          f"{key}: image size {image.size}; expected {expected_size}"
                      )
          print(
              f"Validated 20 HRRR/HRRR-TLE overlays at {expected_size[0]}x{expected_size[1]} "
              f"for TLE anchor {manifest['latest_cycle_utc']}."
          )
          PY

      - name: Commit updated dashboard products
        shell: bash
        run: |
          set -euo pipefail

          # fetch_hrrr_tle.py publishes two standalone deterministic HRRR
          # diagnostics in addition to the 18 HRRR-TLE layers.  Stage both
          # families so the synchronized package cannot partially update.
          products=(
            static/hrrr_latest_12h_max_ffg_ratio.png
            static/hrrr_latest_12h_ffg_exceedance_coverage.png
            static/hrrr_tle_*
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${products[@]}"

          if git diff --cached --quiet; then
            echo "No HRRR / HRRR-TLE product changes to commit."
            exit 0
          fi

          git commit -m "Update HRRR / HRRR-TLE flash flood guidance"

          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            echo "HRRR-TLE sync/push attempt ${attempt}..."
            if ! git pull --rebase origin "${branch}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi
            if git push origin "HEAD:${branch}"; then
              echo 'HRRR-TLE products committed successfully.'
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo 'Unable to push HRRR-TLE products after three attempts.' >&2
          exit 1
