name: Publish RAP GDI
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_rap_gdi.yml'
      - 'tools/gdi/build_rap.py'
      - 'tools/gdi/model_source.py'
      - 'tools/gdi/decode_model.py'
      - 'tools/gdi/render_suite.py'
      - 'tools/gdi/contours.py'
      - 'tools/publish_gdi_suite.py'
permissions:
  contents: read
concurrency:
  group: rap-gdi-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GDI_SUITE: rap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pyproj pillow matplotlib eccodes
      - run: python tools/publish_gdi_suite.py restore --data-dir run/rap-gdi-data --state-file run/rap-gdi-state.json
      - run: python tools/gdi/build_rap.py --public run/rap-gdi-data/public
      - run: python tools/publish_gdi_suite.py publish --data-dir run/rap-gdi-data --state-file run/rap-gdi-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rap-gdi-metadata
          path: run/rap-gdi/*/*.json
          retention-days: 14
