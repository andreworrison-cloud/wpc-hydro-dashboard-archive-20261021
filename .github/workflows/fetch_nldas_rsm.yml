name: Fetch NLDAS-2 Noah Relative Soil Moisture

on:
  # Retired from the dashboard; retain manual execution for reproducibility.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nldas-rsm-update
  cancel-in-progress: false

jobs:
  update-nldas-rsm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install ecCodes system library
        run: |
          # GitHub-hosted Ubuntu runners may include unrelated third-party apt
          # sources (notably Google Chrome). This workflow does not need Chrome;
          # disable that source before refreshing package metadata so a transient
          # Chrome repository hash mismatch cannot block the meteorological job.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "${source_file}" ] && sudo grep -q "dl.google.com/linux/chrome-stable/deb" "${source_file}" 2>/dev/null; then
              echo "Disabling unused Google Chrome apt source: ${source_file}"
              sudo rm -f "${source_file}"
            fi
          done

          # Start from a clean apt-list snapshot and retry transient mirror failures.
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libeccodes0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            numpy \
            xarray \
            h5netcdf \
            h5py \
            rasterio \
            pyproj \
            affine \
            Pillow \
            eccodes

      - name: Generate NLDAS-2 RSM products
        run: python fetch_nldas_rsm.py

      - name: Upload RSM preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: nldas-rsm-preview
          path: |
            static/nldas_rsm_0_10cm.png
            static/nldas_rsm_0_100cm.png
            static/nldas_rsm_metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated products
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            static/nldas_rsm_0_10cm.png \
            static/nldas_rsm_0_100cm.png \
            static/nldas_rsm_metadata.json

          if git diff --cached --quiet; then
            echo "NLDAS-2 RSM products are unchanged."
            exit 0
          fi

          git commit -m "Automated update: NLDAS-2 Noah RSM"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "NLDAS-2 RSM products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push NLDAS-2 RSM products after three attempts."
          exit 1
